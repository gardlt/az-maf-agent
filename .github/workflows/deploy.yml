name: Deploy Azure environment

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'config/**'
      - 'skills/**'
      - 'Dockerfile*'
      - 'infra/**'
      - 'azure.yaml'
      - '.github/workflows/deploy.yml'
      - 'scripts/scan_release_image.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: Promotion target (main merges always deploy dev)
        required: true
        type: choice
        options: [stage, prod, dev]
        default: stage
      service:
        description: Service to update
        required: true
        type: choice
        options: [agent, movie-mcp, web, all]
        default: all

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      MAF_ENABLE_AGENT_IDENTITY: ${{ vars.MAF_ENABLE_AGENT_IDENTITY || 'false' }}
      MAF_AGENT_BLUEPRINT_CLIENT_ID: ${{ vars.MAF_AGENT_BLUEPRINT_CLIENT_ID }}
      MAF_AGENT_IDENTITY_CLIENT_ID: ${{ vars.MAF_AGENT_IDENTITY_CLIENT_ID }}
      MAF_AGENT_IDENTITY_OBJECT_ID: ${{ vars.MAF_AGENT_IDENTITY_OBJECT_ID }}
      MAF_ENABLE_AGENT_TRACING: ${{ vars.MAF_ENABLE_AGENT_TRACING || 'false' }}
      MAF_AGENT_OBSERVABILITY_NAME: ${{ vars.MAF_AGENT_OBSERVABILITY_NAME || 'az-maf-agent' }}
      MAF_REGISTRY_NAME: ${{ vars.MAF_REGISTRY_NAME }}
      MAF_REGISTRY_SKU: ${{ vars.MAF_REGISTRY_SKU || 'Basic' }}
      MAF_TENANT_ID: ${{ vars.MAF_TENANT_ID }}
      MAF_AGENT_AUDIENCE: ${{ vars.MAF_AGENT_AUDIENCE }}
      MAF_ALLOWED_USERS: ${{ vars.MAF_ALLOWED_USERS }}
      MAF_API_CLIENT_ID: ${{ vars.MAF_API_CLIENT_ID }}
      MAF_CLI_CLIENT_ID: ${{ vars.MAF_CLI_CLIENT_ID }}
      MAF_WEB_CLIENT_ID: ${{ vars.MAF_WEB_CLIENT_ID }}
      MAF_ENABLE_WEB: ${{ vars.MAF_ENABLE_WEB || 'false' }}
      MAF_MCP_AUDIENCE: ${{ vars.MAF_MCP_AUDIENCE }}
      MAF_AUTH_CLIENT_SECRET: ${{ secrets.MAF_AUTH_CLIENT_SECRET }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create or update the environment foundation
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            env_name='${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}'
            resource_group="rg-maf-${env_name}-eus2-01"
            managed_environment="cae-maf-${env_name}-eus2-01"
            pull_identity="id-maf-${env_name}-eus2-01"
            logs_name="law-maf-${env_name}-eus2-01"
            if [[ "$env_name" != dev ]]; then
              # The target RG must exist before a group-scoped deployment can run.
              az group create --name "$resource_group" --location "$AZURE_LOCATION" \
                --subscription "$AZURE_SUBSCRIPTION_ID" --output none
            fi
            az deployment group create \
              --name "foundation-${env_name}-${GITHUB_RUN_ID}" \
              --resource-group "$resource_group" \
              --mode Incremental \
              --template-file infra/main.bicep \
              --parameters \
                deploymentTarget=foundation \
                location="$AZURE_LOCATION" \
                environmentName="$managed_environment" \
                registryName="$MAF_REGISTRY_NAME" \
                registrySku="$MAF_REGISTRY_SKU" \
                pullIdentityName="$pull_identity" \
                logsName="$logs_name" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --output none

      - name: Build and push digest-pinned images
        run: |
          set -euo pipefail
          service='${{ github.event_name == 'workflow_dispatch' && inputs.service || 'all' }}'
          az acr login --name "$MAF_REGISTRY_NAME"
          if [[ "$service" == agent || "$service" == all ]]; then
            agent_tag="$MAF_REGISTRY_NAME.azurecr.io/az-maf-agent:${GITHUB_SHA}"
            docker build --platform linux/amd64 --file Dockerfile --tag "$agent_tag" .
            docker run --rm --entrypoint python "$agent_tag" -c "import az_maf_agent.api, az_maf_agent.agent_identity, azure.identity.aio"
            bash scripts/scan_release_image.sh "docker:$agent_tag" security-reports/agent
            docker push "$agent_tag"
            echo "MAF_AGENT_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' "$agent_tag")" >> "$GITHUB_ENV"
          fi
          if [[ "$service" == movie-mcp || "$service" == all ]]; then
            mcp_tag="$MAF_REGISTRY_NAME.azurecr.io/az-maf-movie-mcp:${GITHUB_SHA}"
            docker build --platform linux/amd64 --file Dockerfile.mcp --tag "$mcp_tag" .
            docker run --rm --env MOVIE_MCP_MODE=stdio --entrypoint python "$mcp_tag" -c "import movie_catalog_mcp.server"
            bash scripts/scan_release_image.sh "docker:$mcp_tag" security-reports/movie-mcp
            docker push "$mcp_tag"
            echo "MAF_MCP_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' "$mcp_tag")" >> "$GITHUB_ENV"
          fi
          if [[ "$service" == web || ( "$service" == all && "$MAF_ENABLE_WEB" == true ) ]]; then
            test -n "$MAF_WEB_CLIENT_ID"
            web_tag="$MAF_REGISTRY_NAME.azurecr.io/az-maf-web:${GITHUB_SHA}"
            docker build --platform linux/amd64 --file Dockerfile.web --tag "$web_tag" \
              --build-arg VITE_ENTRA_TENANT_ID="$MAF_TENANT_ID" \
              --build-arg VITE_ENTRA_CLIENT_ID="$MAF_WEB_CLIENT_ID" \
              --build-arg VITE_ENTRA_API_CLIENT_ID="$MAF_API_CLIENT_ID" .
            docker run --rm --env AGENT_API_HOST=example.invalid --entrypoint caddy "$web_tag" \
              validate --config /etc/caddy/Caddyfile --adapter caddyfile
            bash scripts/scan_release_image.sh "docker:$web_tag" security-reports/web
            docker push "$web_tag"
            echo "MAF_WEB_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' "$web_tag")" >> "$GITHUB_ENV"
          fi

      - name: Retain local image scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Preview full environment changes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' }}
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            env_name='${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}'
            az deployment group what-if \
              --name "whatif-${env_name}-${GITHUB_RUN_ID}" \
              --resource-group "rg-maf-${env_name}-eus2-01" \
              --parameters "infra/main.${env_name}.bicepparam" \
              --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Deploy full environment
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' }}
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            env_name='${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}'
            az deployment group create \
              --name "deploy-${env_name}-${GITHUB_RUN_ID}" \
              --resource-group "rg-maf-${env_name}-eus2-01" \
              --mode Incremental \
              --parameters "infra/main.${env_name}.bicepparam" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --output none

      - name: Deploy selected application pattern
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.service != 'all' }}
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            env_name='${{ inputs.environment }}'
            service='${{ inputs.service }}'
            resource_group="rg-maf-${env_name}-eus2-01"
            az deployment group what-if \
              --name "whatif-${service}-${GITHUB_RUN_ID}" \
              --resource-group "$resource_group" \
              --parameters "infra/main.${env_name}.bicepparam" deploymentTarget="$service" \
              --subscription "$AZURE_SUBSCRIPTION_ID"
            az deployment group create \
              --name "deploy-${service}-${GITHUB_RUN_ID}" \
              --resource-group "$resource_group" \
              --mode Incremental \
              --parameters "infra/main.${env_name}.bicepparam" deploymentTarget="$service" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --output none
