name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.2
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: uv sync --locked --all-packages

      - name: Run tests and lint
        run: |
          uv run --locked pytest -q
          uv run --locked ruff check apps scripts
          uv run --locked ruff format --check apps scripts

      - name: Compile infrastructure
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            for file in infra/main.bicep infra/modules/*.bicep; do
              az bicep build --file "$file" --stdout >/dev/null
            done
