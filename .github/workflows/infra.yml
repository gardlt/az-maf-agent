name: Infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'azure.yaml'
      - '.github/workflows/infra.yml'
      - 'scripts/validate_infra.py'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'azure.yaml'
      - '.github/workflows/infra.yml'
      - 'scripts/validate_infra.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate resource modules, patterns, profiles and contracts
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            python3 scripts/validate_infra.py
