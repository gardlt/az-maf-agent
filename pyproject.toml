[project]
name = "az-maf-workspace"
version = "0.1.0"
description = "Workspace for the teaching agent and its movie catalog MCP service"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["apps/agent", "apps/movie-catalog-mcp"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/agent/tests", "apps/movie-catalog-mcp/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["az_maf_agent", "movie_catalog_mcp"]
