[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "movie-catalog-mcp"
version = "0.1.0"
description = "Read-only TMDB movie MCP service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.2",
  "fastmcp>=4,<5",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyJWT[crypto]==2.15.1",
  "uvicorn==0.54.0",
]

[project.scripts]
movie-catalog-mcp = "movie_catalog_mcp.server:main"
