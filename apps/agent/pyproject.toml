[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "az-maf-agent"
version = "0.1.0"
description = "Bounded chat agent teaching application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-framework-core==1.22.0",
  "azure-identity==1.26.0",
  "fastapi==0.143.2",
  "fastmcp==4.1.1",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "cryptography==50.0.2",
  "uvicorn==0.54.0",
  "aiohttp>=3.12,<4",
  "azure-monitor-opentelemetry-exporter==1.0.0b58",
  "ag-ui-protocol==1.0.0",
]

[project.scripts]
agent-chat = "az_maf_agent.cli:main"
